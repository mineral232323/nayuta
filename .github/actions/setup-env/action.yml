name: "Nayuta build environment"
description: "JDK21 + Android SDK + 学習済みアセットを準備して Gradle ビルドする"

inputs:
  tasks:
    description: "実行する Gradle タスク"
    required: false
    default: "assembleDebug"
  self-tag:
    description: "アセット取得で自分自身のタグを除外するためのタグ名"
    required: false
    default: ""
  github-token:
    description: "gh CLI（リリース一覧の取得）用トークン。composite 内では secrets を直接参照できないため呼び出し元から渡す"
    required: true
  keystore-base64:
    description: "リリース署名鍵(PKCS12)の base64。空なら debug 署名でビルドする（PR 検証用）"
    required: false
    default: ""
  store-password:
    description: "キーストアのパスワード。PKCS12 なので鍵パスワードも兼ねる"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    # build.sh は GRADLE_USER_HOME=.cache/gradle を使うので、そこをキャッシュする
    - name: Gradle dependency cache
      uses: actions/cache@v4
      with:
        path: |
          .cache/gradle
          android/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/**/*.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Android SDK (cmdline-tools / android-35 / build-tools 35)
      shell: bash
      run: bash scripts/android/setup_sdk.sh

    - name: Fetch model/dict assets from the latest release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SELF_TAG: ${{ inputs.self-tag }}
      run: |
        # gh の --jq は --arg を解釈できないため、自己タグの除外は grep で行う
        PREV_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 10 \
          --json tagName --jq '.[].tagName' \
          | grep -v -x -F "$SELF_TAG" | head -1)"
        if [[ -z "$PREV_TAG" ]]; then
          echo "error: 取得元のリリースがありません" >&2
          exit 1
        fi
        echo "assets from release: $PREV_TAG"
        NAYUTA_RELEASE_TAG="$PREV_TAG" bash scripts/android/fetch_assets.sh

    # 署名鍵は呼び出し元から input で受け取り、.cache/ に復号して置く。
    # build.gradle.kts は NAYUTA_* 環境変数を読むので、$GITHUB_ENV 経由で後続 step に渡す
    # （composite の各 step は別シェルなので export では届かない）。
    - name: Decode release keystore
      if: inputs.keystore-base64 != ''
      shell: bash
      env:
        KEYSTORE_B64: ${{ inputs.keystore-base64 }}
        STORE_PW: ${{ inputs.store-password }}
      run: |
        mkdir -p .cache
        printf '%s' "$KEYSTORE_B64" | base64 -d > .cache/nayuta-release.p12
        chmod 600 .cache/nayuta-release.p12
        {
          echo "NAYUTA_STORE_FILE=../.cache/nayuta-release.p12"
          echo "NAYUTA_KEY_ALIAS=nayuta"
          echo "NAYUTA_STORE_PASSWORD=$STORE_PW"
        } >> "$GITHUB_ENV"

    - name: Gradle build
      shell: bash
      run: bash scripts/android/build.sh ${{ inputs.tasks }}
