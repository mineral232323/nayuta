# Nayuta Android IME — Gradle settings

# Keep the Gradle / Android caches inside the workspace: $HOME/.cache is read-only
# on this machine. GRADLE_USER_HOME is exported by scripts/android/build.sh.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
