name: Release

# master への push（PR マージ含む）・v* タグ push・手動実行で発火する。
# - master push: versionName から vX.Y.Z-pre を導出し、その pre-release を作成するか
#   既存なら APK を上書き（--clobber）する
# - v* タグ push: そのタグ名で pre-release を作成する
# - 手動実行: ref / tag を指定可（tag 未指定時は master とみなして自動採番）
# ビルドした debug APK を nayuta-<version>-debug.apk として添付する。
# assets（モデル・辞書）は「自分を除く最新リリース」から取得する。

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "ビルドする ref（ブランチ / タグ / SHA）"
        required: false
        default: master
        type: string
      tag:
        description: "作成するリリースタグ（空なら versionName から自動採番: vX.Y.Z-pre）"
        required: false
        type: string

permissions:
  contents: write

# master push とタグ push が同時に走って同じリリースを触らないよう直列化する
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build environment + assembleDebug
        uses: ./.github/actions/setup-env
        with:
          self-tag: ${{ inputs.tag || github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pre-release with APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "master" ]]; then
            VER="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)"
            TAG_NAME="v${VER}-pre"
          fi
          # fetch_assets.sh の命名規則に合わせる（v0.2.6-pre → nayuta-0.2.6-debug.apk）
          APK_OUT="nayuta-${TAG_NAME#v}"
          APK_OUT="${APK_OUT%-pre}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_OUT"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_OUT" --clobber
          else
            gh release create "$TAG_NAME" "$APK_OUT" --prerelease \
              --title "Nayuta ${TAG_NAME#v}" \
              --notes "自動ビルド（${GITHUB_SHA:0:7}）。arm64-v8a のみ同梱。"
          fi
          echo "Released: $TAG_NAME / $APK_OUT"
